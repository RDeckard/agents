services:
  - type: web
    name: agents
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agents-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: agents-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: agents-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: agents-db
          property: connectionString
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "5"

databases:
  - name: agents-db
    plan: free
    region: oregon
